[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-ssm"
version = "0.43.0"
description = "Robust, L2-gain-bounded neural state-space models in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Leonardo Massai" }
]
keywords = [
  "state-space-models",
  "system-identification",
  "robust-control",
  "sequence-modeling",
  "pytorch",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Runtime core. Install the PyTorch build matching the target CPU/CUDA platform.
  "torch>=2.2",
  "deel-torchlip>=1.0",
]

[project.optional-dependencies]
experiments = [
  # Tutorials, visual reports, benchmark harness, and experiment scripts.
  "nonlinear-benchmarks>=1.0.1",
  "numpy>=1.23",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "tqdm>=4.66",
]
dev = [
  "black>=24.3.0",
  "ruff>=0.3.0",
  "mypy>=1.6.0",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ipykernel>=6.29",
  "jupyter>=1.0",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/DecodEPFL/SSM"
Repository = "https://github.com/DecodEPFL/SSM"
Issues = "https://github.com/DecodEPFL/SSM/issues"

[tool.setuptools]
include-package-data = true
license-files = ["LICEN[CS]E*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neural_ssm*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = "\\.pyi?$"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "Test_files"]
extend-exclude = ["build", "dist", ".venv", ".mypy_cache", ".ruff_cache"]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
mypy_path = ["src"]
